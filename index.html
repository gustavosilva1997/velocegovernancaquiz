<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Quiz da Governança Veloce | Plataforma bilíngue</title>
<style>
:root{--ink:#051F61;--mid:#04518C;--light:#00A1D9;--aqua:#47D9BF;--yellow:#F2D03B;--muted:#64748b;--line:#dbe3ef;--bg:#f4f8fc}
*{box-sizing:border-box} body{margin:0;min-height:100vh;background:linear-gradient(135deg,#f4f6fa,#e8eef8);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;display:grid;place-items:center;padding:24px}
.panel{width:min(100%,650px);background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 18px 55px #162c6318;padding:clamp(24px,5vw,48px);text-align:center}
 .brand{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--ink);margin-bottom:12px}
.brand-logos{display:flex;align-items:center;justify-content:center;gap:12px;letter-spacing:normal;text-transform:none}
.main-brand{width:180px;max-width:70%;height:auto;object-fit:contain;display:block}
.grc-brand{width:42px;height:42px;object-fit:contain;display:block}

h1{font-size:clamp(25px,4vw,36px);line-height:1.15;margin:0 0 12px;color:var(--ink)}
.subtitle{font-size:16px;line-height:1.6;color:#526078;margin:0 auto 28px;max-width:480px}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.choice{appearance:none;border:1px solid #cbd5e1;background:#fff;border-radius:16px;padding:22px 16px;cursor:pointer;color:var(--ink);font:inherit;font-weight:750;font-size:18px;transition:transform .15s,border-color .15s,box-shadow .15s}
.choice:hover,.choice:focus-visible{border-color:var(--ink);box-shadow:0 8px 24px #162c6318;transform:translateY(-2px);outline:none}
.flag{display:block;font-size:32px;margin-bottom:9px}
.note{font-size:12px;color:#7b879a;margin-top:24px}
#game{display:none;position:fixed;inset:0;width:100%;height:100%;border:0;background:#f4f6fa}
@media(max-width:460px){.choices{grid-template-columns:1fr}}
</style>
</head>

  }
  if(path==='/api/admin/reset-day'&&method==='POST'){
    const b=body(), attempts=st.attempts||{};for(const [uid,a] of Object.entries(attempts))if(a&&Number(a.day)===Number(b.day))delete attempts[uid];put('qgv_shared_attempts',attempts);put('qgv_shared_daily_reset_version',Number(st.dailyResetVersion||0)+1);return response({ok:true,attempts,dailyResetVersion:Number(st.dailyResetVersion||0)+1,resetVersion:st.resetVersion||0});
  }
  if(path==='/api/import-xlsx') return response({ok:false,error:'O arquivo foi aberto diretamente no navegador. Para importar Excel, execute o servidor do pacote (npm install e npm start) e abra o endereço http://localhost:3000. No teste sem servidor, edite os dados pelo painel.'},501);
  return response({ok:true,localTest:true});
}

async function start(language) {
  document.documentElement.lang = language === 'pt' ? 'pt-BR' : 'es';
  panel.style.display = 'none';
  frame.style.display = 'block';
  frame.title = language === 'pt' ? 'Quiz da Governança Veloce — Português' : 'Quiz de Gobierno Corporativo Veloce — Español';
  const path = window.location.pathname;
  const lastSegment = path.split('/').pop();
  const API_BASE = path.endsWith('/') ? path.replace(/\/$/, '') : (lastSegment.includes('.') ? path.slice(0, path.lastIndexOf('/')) : path);
  let state = null;
  try {
    const response = await fetch(API_BASE + '/api/state', {cache:'no-store'});
    if (!response.ok) throw new Error('API HTTP ' + response.status);
    state = await response.json();
  } catch (error) {
    // Se a API não estiver disponível, abrir em modo local de teste para permitir
    // testar idioma, login e uma rodada sem iniciar o servidor. Os dados ficam
    // somente neste navegador e não são compartilhados.
    window.__QGV_LOCAL_TEST__ = true;
    console.warn('API indisponível; usando modo local de teste.', error);
    state = null;
  }
  let app = decodeBase64Utf8(apps[language]);
  const bootstrap = {};
  if (state && state.initialized) {
    const questionsKey = language === 'pt' ? 'qgv_pt_questions' : 'qgv_es_questions';
    Object.assign(bootstrap, {
      qgv_shared_users: state.users, [questionsKey]: language === 'pt' ? state.questionsPt : state.questionsEs,
      qgv_shared_scores: state.scores, qgv_shared_attempts: state.attempts,
      qgv_shared_qstats: state.qstats, qgv_shared_times: state.times, qgv_shared_reset_version: state.resetVersion, qgv_shared_daily_reset_version: state.dailyResetVersion, qgv_shared_user_reset_versions: state.userResetVersions || {}, qgv_shared_initialized: true, qgv_shared_campaign_dates: state.campaign
    });
  }
  const literal = JSON.stringify(bootstrap).replace(/</g, '\\u003c');
  app = app.replace('<script>', '<script>window.__QGV_API_BASE=' + JSON.stringify(API_BASE) + ';window.__QGV_LOCAL_TEST__=' + (window.__QGV_LOCAL_TEST__ ? 'true' : 'false') + ';' + (window.__QGV_LOCAL_TEST__ ? 'window.__qgvLocalApi=' + __qgvLocalApi.toString() + ';' : '') + 'const __qgvSeed=' + literal + ';for(const [k,v] of Object.entries(__qgvSeed)){if(v!==undefined&&v!==null)localStorage.setItem(k,JSON.stringify(v));}\n');
  frame.srcdoc = app;
}
document.getElementById('ptButton').addEventListener('click', () => start('pt'));
document.getElementById('esButton').addEventListener('click', () => start('es'));
</script>
